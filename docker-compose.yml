# Local infrastructure for Backstory (step 2).
# Start:   docker compose up -d
# Check:   ./scripts/check-infra.ps1
# Stop:    docker compose down        (add -v to also delete all data)
#
# Our own services are added to this file in later steps.

name: backstory

services:

  # ---------------------------------------------------------------- Kafka
  # Single broker in KRaft mode (no ZooKeeper). Two listeners:
  #   kafka:19092     for other containers
  #   localhost:9092  for code running on your Windows host (dotnet run / debugger)
  kafka:
    image: apache/kafka:3.9.0
    container_name: backstory-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"   # any fixed base64 UUID; keeps the cluster identity stable across restarts
      # Empty host = listen on all interfaces. Not 0.0.0.0: Kafka 3.9 derives the controller's
      # advertised address from this line and refuses to advertise 0.0.0.0.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker, so internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared explicitly (kafka-init below), never created by accident on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates our topics once Kafka is healthy, then exits. Safe to re-run (--if-not-exists).
  # Names must match src/Backstory.Core/Contracts/Topics.cs.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: backstory-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 --config retention.ms="$$3"
        }
        DAY=86400000
        create news.articles.v1         3 $$((7*DAY))
        create sources.documents.v1     3 $$((3*DAY))
        create sources.indexed.v1       1 $$((3*DAY))
        create context.requests.v1      3 $$((1*DAY))
        create context.generated.v1     1 $$((7*DAY))
        for t in news.articles.v1 sources.documents.v1 context.requests.v1; do
          create "$$t.dlq" 1 $$((14*DAY))
        done
        echo "Topics now in the cluster:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # Web UI for browsing topics and messages: http://localhost:8081
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: backstory-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ------------------------------------------------------------- Postgres
  # Source of truth for articles and briefs. Tables arrive in step 7.
  postgres:
    image: postgres:17-alpine
    container_name: backstory-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstory-dev}
      POSTGRES_DB: backstory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d backstory"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- Redis
  # Cache only; losing it is harmless. Max 256 MB, evicts least-recently-used keys.
  redis:
    image: redis:7-alpine
    container_name: backstory-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------- Qdrant
  # Vector store. Dashboard: http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: backstory-qdrant
    ports:
      - "6333:6333"   # REST (we use this)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------- Ollama
  # OFF by default: on Windows, install Ollama natively so it uses your GPU directly.
  # Only if you prefer it in Docker:  docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: backstory-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Uncomment to give the container your NVIDIA GPU (Docker Desktop + WSL2):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  kafka-data:
  postgres-data:
  qdrant-data:
  ollama-data:
